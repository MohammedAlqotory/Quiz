  <style>
    * {

      margin: 0;
      padding: 0;
    }
    body {

      color: #333;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {

      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 26px;
      color: #2c3e50;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 15px;
      color: #7f8c8d;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 760px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      padding: 25px;
      margin-bottom: 20px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid #edf0f2;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .jump-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .jump-box span {
      font-size: 14px;
      color: #555;
    }
    .jump-box input {
      width: 70px;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      font-size: 15px;
    }
    .btn-jump {
      background-color: #4a77d4;
      color: white;
      border: none;
      padding: 7px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-jump:hover {
      background-color: #3b63b8;
    }
    .btn-reset {
      background: none;
      border: none;
      color: #7f8c8d;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-reset:hover {
      color: #e74c3c;
    }
    .score-badge {
      font-size: 16px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .q-counter {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: left;
    }
    .question-box {
      background-color: #27ae60;
      color: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      background: #fafbfc;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      padding: 14px 18px;
      text-align: right;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      color: #333;
    }
    .option-btn:hover:not([disabled]) {
      background-color: #f0f4f8;
      border-color: #b0b8c4;
    }
    .option-btn.correct {
      background-color: #d4edda !important;
      border-color: #28a745 !important;
      color: #155724 !important;
      font-weight: bold;
    }
    .option-btn.incorrect {
      background-color: #f8d7da !important;
      border-color: #dc3545 !important;
      color: #721c24 !important;
      font-weight: bold;
    }

      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      background-color: #eef7fc;
      border-right: 5px solid #2980b9;
      font-size: 15px;
      line-height: 1.6;
      color: #1a5276;
    }
    .explanation-box.show {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      border-top: 1px solid #edf0f2;
      padding-top: 18px;
    }

      background-color: #e67e22;
      color: white;
      border: none;
      padding: 9px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-nav:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .btn-nav:hover:not(:disabled) {
      background-color: #d35400;
    }
  </style>
</head>

          "فشل إدارة الوقت للمستخدمين",
          "أ و ب معاً"
        ],
        ans: 3,
        exp: "انتهاك البيانات وسرقة الخصوصية واستغلال خوارزميات التتبع تمثل أكبر الثغرات الأمنية."
      },
      {
        q: "تقوم فكرة حروب الجيل الرابع على أن الفاعل الرئيسي في هذه الحروب هم:",
        opts: [
          "المنظمات الدولية الحكومية",
          "التنظيمات والأفراد",
          "الدولة",
          "كل ما سبق"
        ],
        ans: 1,
        exp: "الفواعل غير الحكومية والتنظيمات السرية والأفراد هم المحركون الحقيقيون للجيل الرابع."
      },
      {
        q: "تعتبر مدينة ومنتجع الجلالة ثاني أكبر مشروع تنموي عمراني سياحي في مصر بعد مشروع:",
        opts: [
          "مدينة العلمين الجديدة",
          "مدينة دمياط الجديدة",
          "العاصمة الإدارية الجديدة",
          "قناة السويس الجديدة"
        ],
        ans: 0,
        exp: "صُنفت الجلالة كثاني أضخم مشروع عمراني وسياحي بعد مدينة العلمين الجديدة."
      },
      {
        q: "تعتبر ............... من أخطر أساليب العمليات النفسية استخداماً وتأثيراً على الأهداف:",
        opts: [
          "الشائعات",
          "حرب الجيل الخامس",
          "الجاسوسية",
          "العملاء المزدوجين"
        ],
        ans: 0,
        exp: "الشائعات تتصدر قائمة أسلحة الحرب النفسية لسرعتها وتغلغلها في الوجدان الشعبي."
      },
      {
        q: "تم تكليف الهيئة الهندسية بتطوير ورفع كفاءة عدد (12) مطار (مدني - جوي - عسكري) بتكلفة:",
        opts: [
          "250 مليون جنيه تقريباً",
          "550 مليون جنيه تقريباً",
          "10 مليار جنيه تقريباً",
          "5 مليار جنيه تقريباً"
        ],
        ans: 2,
        exp: "بلغت التكلفة الإجمالية المعتمدة لرفع كفاءة وتحديث الـ 12 مطاراً نحو 10 مليارات جنيه."
      },
      {
        q: "يعتبر من بين أسباب تعاطي المخدرات:",
        opts: [
          "استخدام بعض الأدوية دون استشارة طبية",
          "التشخيص الطبي الخاطئ",
          "كل ما سبق"
        ],
        ans: 2,
        exp: "التطبيب الذاتي الخاطئ وتناول المسكنات والمهدئات عشوائياً بوابة رئيسية للإدمان."
      },
      {
        q: "من أنواع مواقع التواصل الإجتماعي:",
        opts: [
          "مواقع تختص في نشر ومشاركة المعلومات",
          "مواقع خدمة الإتصالات",
          "مواقع إستعراض السلع والرأي",
          "كل ما سبق"
        ],
        ans: 3,
        exp: "تتنوع منصات التواصل بحسب الغرض ما بين إخباري، اتصالي، وتسويقي تفاعلي."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let answered = new Array(questions.length).fill(null);

    const jumpInput = document.getElementById("jumpInput");
    jumpInput.max = questions.length;
    jumpInput.placeholder = `1 إلى ${questions.length}`;

    function renderQuestion() {
      const qData = questions[currentIndex];
      document.getElementById("counter").innerText = `السؤال ${currentIndex + 1} من ${questions.length}`;
      document.getElementById("questionText").innerText = `س : ${currentIndex + 1} : ${qData.q}`;
      document.getElementById("score").innerText = `الدرجة: ${score}`;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      const expBox = document.getElementById("explanationBox");

      if (answered[currentIndex] !== null) {
        expBox.innerHTML = `<strong>💡 التوضيح والتحليل:</strong> ${qData.exp}`;
        expBox.classList.add("show");
      } else {
        expBox.innerHTML = "";
        expBox.classList.remove("show");
      }

      qData.opts.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;

        if (answered[currentIndex] !== null) {
          btn.disabled = true;
          if (index === qData.ans) {
            btn.classList.add("correct");
          } else if (index === answered[currentIndex]) {
            btn.classList.add("incorrect");
          }
        } else {
          btn.onclick = () => selectOption(index);
        }

        container.appendChild(btn);
      });

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").innerText = (currentIndex === questions.length - 1) ? "إنهاء" : "التالي";
    }

    function selectOption(selectedIndex) {
      const qData = questions[currentIndex];
      answered[currentIndex] = selectedIndex;

      if (selectedIndex === qData.ans) {
        score++;
      }
      renderQuestion();
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        alert(`تم الانتهاء من الاختبار بنجاح!\nدرجتك النهائية: ${score} من ${questions.length}`);
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function jumpToQuestion() {
      const val = parseInt(jumpInput.value);
      if (val >= 1 && val <= questions.length) {
        currentIndex = val - 1;
        renderQuestion();
      } else {
        alert(`يرجى كتابة رقم بين 1 و ${questions.length}`);
      }
    }

    function resetQuiz() {
      if (confirm("هل أنت متأكد من إعادة تعيين الاختبار والدرجات من البداية؟")) {
        currentIndex = 0;
        score = 0;
        answered = new Array(questions.length).fill(null);
        renderQuestion();
      }
    }

    renderQuestion();
  </script>
